# Netlify configuration. Build runs in GitHub Actions (job A); `netlify deploy` in job B
# uploads dist/ and bundles netlify/functions/. Netlify's own Git builds are STOPPED in
# the site settings so that only the Actions pipeline can deploy (see README).

[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # mssql/tedious bundle fine with esbuild; if the bundler chokes, uncomment:
  # external_node_modules = ["mssql"]

[dev]
  framework  = "vite"
  targetPort = 5173

# Access control on this team is Netlify's SSO team login, applied at the team level to
# every site before any request reaches these files or the functions. The earlier Netlify
# Identity + `Role=` redirect rules were removed on 2026-09-17: no Identity instance exists on
# this site and the team default makes them redundant. See docs/findings.md row 1.
