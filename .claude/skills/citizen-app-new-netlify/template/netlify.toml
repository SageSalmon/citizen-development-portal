# Netlify configuration for __APP_NAME__.
# Access control is whatever the Netlify TEAM enforces (on an Enterprise team, SSO team
# login before any request reaches these files). This app does not implement login and
# receives no user identity; /api/me says so honestly.
[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  framework  = "vite"
  targetPort = 5173
